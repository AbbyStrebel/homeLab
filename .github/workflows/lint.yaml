name: lint

# Lightweight hygiene CI for this repo's own docs and scripts: catch bad YAML,
# broken shell, and sloppy Markdown before they land. Deliberately modest — this
# lints the repo, it does not test the lab.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets me run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          # Non-fatal if scripts/ is empty for now; tighten once scripts land.
          severity: warning

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
